AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Frontend CDN — CloudFront distribution, its domain alias, the S3 bucket policy
  granting the distribution read access, the ArangoDB origin-request policy, and
  the Route53 record. These are the resources that COLLIDE with an existing
  environment on the same domain (the CloudFront alias and the Route53 record
  are globally unique), so this stack is deployed LAST, at cutover, after the
  previous distribution has released the domain alias. Everything non-conflicting
  (the S3 bucket) lives in frontend.yaml and deploys side by side ahead of time.

Parameters:
  ProjectName:
    Type: String
    Description: Project name for resource naming

  Environment:
    Type: String
    Default: dev
    Description: Environment name (dev, stage, sandbox, prod)
    AllowedValues:
      - dev
      - stage
      - sandbox
      - prod

  AttachAlias:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Whether to attach the domain alias and its Route53 record to this
      distribution. The alias (a CloudFront CNAME) and the Route53 record are
      globally unique, so they collide with an existing environment already
      serving the same domain. Deploy with 'false' first: the distribution comes
      up alias-less (side by side with the old one) but with the ACM cert, which
      is all that associate-alias needs. Move the alias off the old distribution
      with `aws cloudfront associate-alias`, then redeploy with 'true' to attach
      the alias here and repoint DNS. See deploy/cutover-frontend-cdn.sh.

  # All other inputs come from cross-stack imports:
  #   Frontend bucket   → ${ProjectName}-${Environment}-frontend-bucket        (frontend.yaml)
  #   Frontend bucket domain → ${ProjectName}-${Environment}-frontend-bucket-domain (frontend.yaml)
  #   Frontend bucket ARN    → ${ProjectName}-${Environment}-frontend-bucket-arn    (frontend.yaml)
  #   DomainName        → ${ProjectName}-${Environment}-domain-name
  #   HostedZoneId      → ${ProjectName}-${Environment}-hosted-zone-id
  #   AlbDnsName        → ${ProjectName}-${Environment}-alb-dns
  #   CertificateArn    → ${ProjectName}-${Environment}-acm-cert-arn
  #   CloudFrontSecret  → {{resolve:secretsmanager:/${ProjectName}/${Environment}/secrets/cloudfront-secret:SecretString}}

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - ProjectName
          - Environment

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']
  # Stage is the promotion source for the sandbox account: its frontend bucket
  # grants cross-account read so deploy-sandbox.sh can sync the built bundle.
  IsStage: !Equals [!Ref Environment, 'stage']
  # Gates the domain alias on the distribution and the Route53 record — the two
  # globally-unique resources that collide at cutover (see AttachAlias).
  ShouldAttachAlias: !Equals [!Ref AttachAlias, 'true']

Resources:
  # ============================================================================
  # CloudFront Origin Access Control
  # ============================================================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${Environment}-oac'
        Description: !Sub 'OAC for ${ProjectName} ${Environment} frontend'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ============================================================================
  # S3 Bucket Policy for CloudFront OAC
  #
  # Lives with the distribution (not the bucket) because its SourceArn condition
  # binds to this stack's CloudFrontDistribution. The bucket itself is created
  # in frontend.yaml; here we import its name/ARN.
  # ============================================================================
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !ImportValue
        Fn::Sub: '${ProjectName}-${Environment}-frontend-bucket'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub
              - '${BucketArn}/*'
              - BucketArn: !ImportValue
                  Fn::Sub: '${ProjectName}-${Environment}-frontend-bucket-arn'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'
          # Stage only: allow the sandbox account (206537881715) to read the
          # built frontend so it can be promoted cross-account (mirrors the
          # ArangoDB dataset bucket grant in shared/shared-resources.yaml).
          - !If
              - IsStage
              - Sid: AllowSandboxPromotionRead
                Effect: Allow
                Principal:
                  AWS: 'arn:aws:iam::206537881715:root'
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !ImportValue
                      Fn::Sub: '${ProjectName}-${Environment}-frontend-bucket-arn'
                  - !Sub
                      - '${BucketArn}/*'
                      - BucketArn: !ImportValue
                          Fn::Sub: '${ProjectName}-${Environment}-frontend-bucket-arn'
              - !Ref 'AWS::NoValue'

  # ============================================================================
  # CloudFront Distribution
  # ============================================================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Comment: !Sub '${ProjectName} ${Environment} frontend'
        # Omitted on the first (alias-less) deploy so the distribution doesn't
        # collide with the existing environment's alias; attached at cutover via
        # AttachAlias=true after associate-alias has moved it here.
        Aliases: !If
          - ShouldAttachAlias
          - - !If
                - IsProd
                - !ImportValue
                    Fn::Sub: '${ProjectName}-${Environment}-domain-name'
                - !Sub
                  - '${Environment}.${Domain}'
                  - Domain: !ImportValue
                      Fn::Sub: '${ProjectName}-${Environment}-domain-name'
          - !Ref 'AWS::NoValue'

        # Default origin (S3 - frontend)
        DefaultRootObject: index.html
        Origins:
          # S3 Origin for frontend
          - Id: S3Origin
            DomainName: !ImportValue
              Fn::Sub: '${ProjectName}-${Environment}-frontend-bucket-domain'
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}

          # ALB Origin for backend API (port 8000)
          - Id: ALBOrigin
            DomainName: !ImportValue
              Fn::Sub: '${ProjectName}-${Environment}-alb-dns'
            CustomOriginConfig:
              HTTPSPort: 8000
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders:
              - HeaderName: X-Custom-Origin-Header
                HeaderValue: !Sub '{{resolve:secretsmanager:/${ProjectName}/${Environment}/secrets/cloudfront-secret:SecretString}}'

          # ALB Origin for ArangoDB web UI (port 8529)
          - Id: ArangoDbOrigin
            DomainName: !ImportValue
              Fn::Sub: '${ProjectName}-${Environment}-alb-dns'
            CustomOriginConfig:
              HTTPSPort: 8529
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders:
              - HeaderName: X-Custom-Origin-Header
                HeaderValue: !Sub '{{resolve:secretsmanager:/${ProjectName}/${Environment}/secrets/cloudfront-secret:SecretString}}'

        # Default behavior (S3)
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized

        # Cache behaviors (evaluated in order; most specific paths first)
        CacheBehaviors:
          # Backend API
          - PathPattern: /arango_api/*
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # Managed-AllViewer

          # ArangoDB web UI and REST API paths
          - PathPattern: /_db/*
            TargetOriginId: ArangoDbOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # Managed-AllViewer

          - PathPattern: /_api/*
            TargetOriginId: ArangoDbOrigin
            OriginRequestPolicyId: !Ref ArangoDbOriginRequestPolicy
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled

          - PathPattern: /_admin/*
            TargetOriginId: ArangoDbOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # Managed-AllViewer

        # Custom error responses
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

        # SSL/TLS certificate (from alb.yaml, shared with ALB listeners)
        ViewerCertificate:
          AcmCertificateArn: !ImportValue
            Fn::Sub: '${ProjectName}-${Environment}-acm-cert-arn'
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        # Price class
        PriceClass: PriceClass_100

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-cloudfront'
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  # ============================================================================
  # CloudFront OriginRequestPolicy
  # ============================================================================
  ArangoDbOriginRequestPolicy:
      Type: AWS::CloudFront::OriginRequestPolicy
      Properties:
        OriginRequestPolicyConfig:
          Name: !Sub '${ProjectName}-${Environment}-arangodb-policy'
          Comment: 'Forwards Host header for ArangoDB redirects'
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Host
              - X-Forwarded-Host
          CookiesConfig:
            CookieBehavior: all
          QueryStringsConfig:
            QueryStringBehavior: all

  # ============================================================================
  # Route 53 Record — intentionally NOT managed here.
  # ============================================================================
  # The domain's A/alias record is owned by the deploy/cutover scripts, which
  # UPSERT it (deploy/cutover-frontend-cdn.sh). Reasons this is not a
  # CloudFormation resource:
  #   1. CloudFormation issues a Route53 CREATE for a new RecordSet, which FAILS
  #      ("...but it already exists") whenever a record for the domain is already
  #      present — which it always is at cutover (the old environment's record,
  #      or the one the cutover script just wrote). UPSERT has no such conflict.
  #   2. It avoids two CloudFormation stacks (old + new) both claiming the same
  #      globally-unique record, where deleting the old stack would delete the
  #      live record out from under this distribution.
  # The distribution's alias (AttachAlias) is still managed here; only the DNS
  # record is script-owned.

Outputs:
  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${ProjectName}-${Environment}-cloudfront-id'

  CloudFrontDomainName:
    Description: CloudFront domain name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-cloudfront-domain'

  FrontendUrl:
    Description: Frontend URL
    Value: !Sub
      - 'https://${Domain}'
      - Domain: !If
          - IsProd
          - !ImportValue
              Fn::Sub: '${ProjectName}-${Environment}-domain-name'
          - !Sub
            - '${Environment}.${D}'
            - D: !ImportValue
                Fn::Sub: '${ProjectName}-${Environment}-domain-name'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-frontend-url'
