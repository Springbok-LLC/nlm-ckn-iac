AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Frontend storage — S3 bucket for the built site. Contains no globally-unique
  resources, so it deploys side by side with an existing environment (e.g. the
  cell-kn -> nlm-ckn rename). The CloudFront distribution, its alias, the bucket
  policy and the Route53 record live in frontend-cdn.yaml, which is deployed
  LAST at cutover (after the old distribution releases the domain alias).

Parameters:
  ProjectName:
    Type: String
    Description: Project name for resource naming

  Environment:
    Type: String
    Default: dev
    Description: Environment name (dev, stage, sandbox, prod)
    AllowedValues:
      - dev
      - stage
      - sandbox
      - prod

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - ProjectName
          - Environment

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']

Resources:
  # ============================================================================
  # S3 Bucket for Frontend
  # ============================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-frontend'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNonCurrentVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
            ExpiredObjectDeleteMarker: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-frontend'
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

Outputs:
  BucketName:
    Description: S3 bucket name for frontend
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-frontend-bucket'

  BucketDomainName:
    Description: S3 bucket domain name (CloudFront S3 origin, consumed by frontend-cdn.yaml)
    Value: !GetAtt FrontendBucket.DomainName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-frontend-bucket-domain'

  BucketArn:
    Description: S3 bucket ARN (bucket policy resource, consumed by frontend-cdn.yaml)
    Value: !GetAtt FrontendBucket.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-frontend-bucket-arn'
