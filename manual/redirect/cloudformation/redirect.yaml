AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFront distribution that 301-redirects cell-kn.org and nlm-ckn.org to stage.nlm-ckn.org'

# ==============================================================================
# IMPORTANT: This stack MUST be deployed in us-east-1.
# CloudFront only accepts ACM certificates and CloudFront functions from us-east-1.
# ==============================================================================

Parameters:
  CertificateArn:
    Type: String
    Description: >-
      ARN of an ACM certificate (in us-east-1) that covers BOTH cell-kn.org and
      nlm-ckn.org. The cert must already be issued/validated before deploying this
      stack. A single cert with two SANs, or a wildcard covering both apex names,
      works.

  CellKnHostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone ID for cell-kn.org

  NlmCknHostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone ID for nlm-ckn.org

  RedirectTarget:
    Type: String
    Default: stage.nlm-ckn.org
    Description: Host that both source domains redirect to

  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: Retention (days) for the Route 53 query log and CloudFront access log groups

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Certificate
        Parameters:
          - CertificateArn
      - Label:
          default: Hosted Zones
        Parameters:
          - CellKnHostedZoneId
          - NlmCknHostedZoneId
      - Label:
          default: Redirect
        Parameters:
          - RedirectTarget
      - Label:
          default: Logging
        Parameters:
          - LogRetentionDays

Resources:
  # ============================================================================
  # CloudFront Function - viewer-request 301 redirect
  # ============================================================================
  RedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: redirect-to-stage
      AutoPublish: true
      FunctionConfig:
        Comment: '301 redirect cell-kn.org / nlm-ckn.org to stage.nlm-ckn.org'
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
            var request = event.request;
            var target = '${RedirectTarget}';

            var qs = '';
            for (var key in request.querystring) {
                var v = request.querystring[key];
                qs += (qs ? '&' : '') + key + (v.value !== '' ? '=' + v.value : '');
                if (v.multiValue) {
                    for (var i = 0; i < v.multiValue.length; i++) {
                        qs += '&' + key + '=' + v.multiValue[i].value;
                    }
                }
            }

            var location = 'https://' + target + request.uri + (qs ? '?' + qs : '');

            return {
                statusCode: 301,
                statusDescription: 'Moved Permanently',
                headers: {
                    'location': { value: location }
                }
            };
        }

  # ============================================================================
  # CloudFront Distribution
  # ============================================================================
  RedirectDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: 'Redirect to stage'
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - cell-kn.org
          - nlm-ckn.org

        # A real origin is required even though the viewer-request function
        # short-circuits every request with a 301 before the origin is reached.
        Origins:
          - Id: PlaceholderOrigin
            DomainName: !Ref RedirectTarget
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

        DefaultCacheBehavior:
          TargetOriginId: PlaceholderOrigin
          ViewerProtocolPolicy: allow-all
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: false
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RedirectFunction.FunctionMetadata.FunctionARN

        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

      Tags:
        - Key: Name
          Value: redirect-to-stage
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: nlm-ckn
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  # ============================================================================
  # Route 53 A (alias) records -> CloudFront
  # ============================================================================
  CellKnRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref CellKnHostedZoneId
      Name: cell-kn.org
      Type: A
      AliasTarget:
        DNSName: !GetAtt RedirectDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        EvaluateTargetHealth: false

  CellKnRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref CellKnHostedZoneId
      Name: cell-kn.org
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt RedirectDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  NlmCknRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref NlmCknHostedZoneId
      Name: nlm-ckn.org
      Type: A
      AliasTarget:
        DNSName: !GetAtt RedirectDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  NlmCknRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref NlmCknHostedZoneId
      Name: nlm-ckn.org
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt RedirectDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ============================================================================
  # Route 53 DNS query logging
  # Query logging configs and their log groups MUST be in us-east-1.
  # ============================================================================
  CellKnQueryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/route53/cell-kn.org
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Name
          Value: redirect-to-stage-dns-cell-kn
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: nlm-ckn
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  NlmCknQueryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/route53/nlm-ckn.org
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Name
          Value: redirect-to-stage-dns-nlm-ckn
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: nlm-ckn
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  # One account-level policy covering every /aws/route53/* group (CloudWatch Logs
  # allows only 10 resource policies per region, 5120 chars each).
  Route53QueryLogResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: route53-query-logging
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "Route53QueryLogging",
              "Effect": "Allow",
              "Principal": { "Service": "route53.amazonaws.com" },
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": "arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/route53/*",
              "Condition": {
                "StringEquals": { "aws:SourceAccount": "${AWS::AccountId}" },
                "ArnLike": { "aws:SourceArn": "arn:aws:route53:::hostedzone/*" }
              }
            }
          ]
        }

  CellKnQueryLoggingConfig:
    Type: AWS::Route53::QueryLoggingConfig
    DependsOn: Route53QueryLogResourcePolicy
    Properties:
      HostedZoneId: !Ref CellKnHostedZoneId
      CloudWatchLogsLogGroupArn: !Sub 'arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:${CellKnQueryLogGroup}'

  NlmCknQueryLoggingConfig:
    Type: AWS::Route53::QueryLoggingConfig
    DependsOn: Route53QueryLogResourcePolicy
    Properties:
      HostedZoneId: !Ref NlmCknHostedZoneId
      CloudWatchLogsLogGroupArn: !Sub 'arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:${NlmCknQueryLogGroup}'

  # ============================================================================
  # CloudFront standard logging (v2) -> CloudWatch Logs
  # ============================================================================
  # /aws/vendedlogs/ prefix keeps the log-delivery resource policy that CloudWatch
  # Logs manages for vended logs from growing per log group.
  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/cloudfront/redirect-to-stage
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Name
          Value: redirect-to-stage-access-logs
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: nlm-ckn
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  AccessLogDeliverySource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: redirect-to-stage-cloudfront
      LogType: ACCESS_LOGS
      ResourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${RedirectDistribution}'
      Tags:
        - Key: Name
          Value: redirect-to-stage-cloudfront
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: nlm-ckn
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  AccessLogDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: redirect-to-stage-cloudwatch
      DestinationResourceArn: !Sub 'arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:${AccessLogGroup}'
      OutputFormat: json
      Tags:
        - Key: Name
          Value: redirect-to-stage-cloudwatch
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: nlm-ckn
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  AccessLogDelivery:
    Type: AWS::Logs::Delivery
    Properties:
      DeliverySourceName: !Ref AccessLogDeliverySource
      DeliveryDestinationArn: !GetAtt AccessLogDeliveryDestination.Arn
      Tags:
        - Key: Name
          Value: redirect-to-stage-access-logs
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: nlm-ckn
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

Outputs:
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref RedirectDistribution

  DistributionDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt RedirectDistribution.DomainName

  CellKnQueryLogGroupName:
    Description: CloudWatch Logs group receiving Route 53 query logs for cell-kn.org
    Value: !Ref CellKnQueryLogGroup

  NlmCknQueryLogGroupName:
    Description: CloudWatch Logs group receiving Route 53 query logs for nlm-ckn.org
    Value: !Ref NlmCknQueryLogGroup

  AccessLogGroupName:
    Description: CloudWatch Logs group receiving CloudFront access logs
    Value: !Ref AccessLogGroup
