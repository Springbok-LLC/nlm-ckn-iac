AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bootstrap infrastructure for Cell-KN - S3 for templates, OIDC provider, and IAM roles'

Parameters:
  ProjectName:
    Type: String
    Description: Project name for resource naming

  GitHubOrg:
    Type: String
    Description: GitHub organization or user name that owns the fork where CI runs
    Default: Springbok-LLC

  GitHubRepo:
    Type: String
    Description: GitHub repository name
    Default: nlm-ckn-ui

  CreateOIDCProvider:
    Type: String
    Description: >-
      Whether to create the GitHub OIDC provider. AWS allows only one OIDC
      provider per URL per account, so set this to "false" if the account
      already has a provider for token.actions.githubusercontent.com.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - ProjectName
      - Label:
          default: GitHub Configuration
        Parameters:
          - GitHubOrg
          - GitHubRepo
          - CreateOIDCProvider

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:
  # ============================================================================
  # S3 Bucket for CloudFormation Templates
  # ============================================================================
  TemplatesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-cfn-templates-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub '${ProjectName}-cfn-templates-${AWS::AccountId}'
        - Key: Purpose
          Value: CloudFormation template storage
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  # ============================================================================
  # S3 Bucket for Stack Outputs and State
  # ============================================================================
  # This replaces Terraform state - used to store stack outputs and deployment metadata
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-cfn-state-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub '${ProjectName}-cfn-state-${AWS::AccountId}'
        - Key: Purpose
          Value: CloudFormation state and outputs
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  # ============================================================================
  # GitHub OIDC Provider
  # ============================================================================
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # GitHub's OIDC thumbprints (stable; rotated by GitHub with notice).
        # Both are required — GitHub rotated its certificate, and a provider
        # missing the newer thumbprint fails token validation
        # ("web identity token provided could not be validated").
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub '${ProjectName}-github-oidc'
        - Key: Purpose
          Value: GitHub Actions OIDC authentication
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  # ============================================================================
  # IAM Role for GitHub Actions
  # ============================================================================
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-actions'
      Description: Role for GitHub Actions to deploy infrastructure
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !GetAtt GitHubOIDCProvider.Arn
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringLike:
                # Only main and the stage environment, in the fork (where CI
                # runs; GitHubOrg/GitHubRepo) and the NIH-NLM upstream. A pull
                # request runs its own copy of the workflow, so trusting any ref
                # would let a PR assume this deployment role without review.
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:stage'
                  - 'repo:NIH-NLM/nlm-ckn-ui:ref:refs/heads/main'
                  - 'repo:NIH-NLM/nlm-ckn-ui:environment:stage'
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
      Policies:
        - PolicyName: CellKnDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudFormation management
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'
              # S3 for templates, frontend, datasets
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*/*'
              # ECR for Docker images
              - Effect: Allow
                Action:
                  - ecr:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/${ProjectName}-*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              # ECS for services and tasks
              - Effect: Allow
                Action:
                  - ecs:*
                Resource: '*'
              # IAM for service roles
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
              # IAM instance profiles (for arangodb.yaml IsSelfManaged EC2 instances)
              - Effect: Allow
                Action:
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${ProjectName}-*'
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource: '*'
              # EC2 for security groups, VPC, and subnet management
              - Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroup*
                  - ec2:RevokeSecurityGroup*
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  # VPC and subnet lifecycle (for Staging network stack)
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:DescribeVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DescribeInternetGateways
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:DescribeRouteTables
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:DescribeAddresses
                  - ec2:CreateNatGateway
                  - ec2:DeleteNatGateway
                  - ec2:DescribeNatGateways
                  - ec2:DescribeAvailabilityZones
                Resource: '*'
              # ELB for ALB
              - Effect: Allow
                Action:
                  - elasticloadbalancing:*
                Resource: '*'
              # CloudFront
              - Effect: Allow
                Action:
                  - cloudfront:*
                Resource: '*'
              # Route 53
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:GetChange
                Resource: '*'
              # ACM for certificates
              - Effect: Allow
                Action:
                  - acm:*
                Resource: '*'
              # SSM Parameter Store
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                  - ssm:ListTagsForResource
                  - ssm:RemoveTagsFromResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/${ProjectName}/*'
              # SSM Run Command (used by deploy-dataset.sh to trigger ArangoDB restore on EC2)
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
                  - !Sub 'arn:${AWS::Partition}:ssm:*::document/AWS-RunShellScript'
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                Resource: '*'
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:DescribeLogGroups
                  - logs:ListTagsForResource
                Resource: '*'
              # Lambda for custom resources
              - Effect: Allow
                Action:
                  - lambda:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${ProjectName}-*'
              # EFS
              - Effect: Allow
                Action:
                  - elasticfilesystem:*
                Resource: '*'
              # Service Discovery (Cloud Map)
              - Effect: Allow
                Action:
                  - servicediscovery:*
                Resource: '*'
              # Application Auto Scaling
              - Effect: Allow
                Action:
                  - application-autoscaling:*
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub '${ProjectName}-github-actions'
        - Key: Purpose
          Value: GitHub Actions deployment role
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

  # ============================================================================
  # IAM Role for the nlm-ckn-ui preset sweep
  #
  # CI on a pull request downloads the golden dump its ETL_VERSION names and
  # sweeps the presets against it. PRs and branches may assume this role, so it
  # can only read the dataset bucket's name and download golden dumps.
  # ============================================================================
  PresetSweepRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-preset-sweep'
      Description: Assumed by nlm-ckn-ui CI to download golden dumps for the preset sweep
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !GetAtt GitHubOIDCProvider.Arn
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:pull_request'
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/*'
      Policies:
        - PolicyName: PresetSweepRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/shared/arangodb-bucket-name'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-arangodb-data-${AWS::AccountId}/runs/*/06-golden-dump.tar.gz'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: nlm-ckn-ui preset sweep - read-only
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: springbok
        - Key: Repository
          Value: nlm-ckn-iac

Outputs:
  TemplatesBucketName:
    Description: S3 bucket for CloudFormation templates
    Value: !Ref TemplatesBucket
    Export:
      Name: !Sub '${ProjectName}-templates-bucket'

  StateBucketName:
    Description: S3 bucket for stack outputs and state
    Value: !Ref StateBucket
    Export:
      Name: !Sub '${ProjectName}-state-bucket'


  GitHubOIDCProviderArn:
    Description: GitHub OIDC Provider ARN
    Value: !If
      - ShouldCreateOIDCProvider
      - !GetAtt GitHubOIDCProvider.Arn
      - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
    Export:
      Name: !Sub '${ProjectName}-github-oidc-arn'

  GitHubActionsRoleArn:
    Description: IAM Role ARN for GitHub Actions
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub '${ProjectName}-github-actions-role-arn'

  GitHubActionsRoleName:
    Description: IAM Role name for GitHub Actions
    Value: !Ref GitHubActionsRole

  PresetSweepRoleArn:
    Description: IAM Role ARN for the nlm-ckn-ui preset sweep
    Value: !GetAtt PresetSweepRole.Arn

  DeploymentInstructions:
    Description: Next steps for deployment
    Value: !Sub |
      Bootstrap complete! Next steps:
      1. Configure GitHub Actions to use role: ${GitHubActionsRole.Arn}
      2. Deploy an environment: ./deploy/02-deploy-environment.sh dev
      See docs/DEPLOYMENT.md for full details.
