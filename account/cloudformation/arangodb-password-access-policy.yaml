AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Customer-managed IAM policy granting read access (secretsmanager:GetSecretValue)
  to the ArangoDB password secrets for the dev and stage environments
  (/<ProjectName>/dev/secrets/arangodb-password and
  /<ProjectName>/stage/secrets/arangodb-password). Attach this policy to any
  role that needs to read the ArangoDB password.

Parameters:
  ProjectName:
    Type: String
    Default: nlm-ckn
    Description: Project name used in the secret paths (/<ProjectName>/<env>/secrets/arangodb-password)

Resources:
  ArangoDbPasswordAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-arangodb-password-access'
      Description: Read access to the dev and stage ArangoDB password secrets
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadArangoDbPasswordSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            # Secrets Manager appends a random 6-char suffix to the ARN, so a
            # trailing '-??????' matches exactly that suffix (each '?' matches
            # one char) without the broad reach of a trailing '*'.
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/dev/secrets/arangodb-password-??????'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/stage/secrets/arangodb-password-??????'

Outputs:
  PolicyArn:
    Description: ARN of the managed policy granting ArangoDB password secret access
    Value: !Ref ArangoDbPasswordAccessPolicy
