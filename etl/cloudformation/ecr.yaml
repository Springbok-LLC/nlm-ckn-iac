AWSTemplateFormatVersion: "2010-09-09"
Description: >
  NLM-CKN ECR — two container registries for the NLM-CKN ETL project.

  <ProjectName>-etl-pipeline  — AWS Batch ETL job (Python + JRE; runs pipeline.py)
  <ProjectName>-etl-fetcher   — ECS Fargate fetch task (Python only; runs fetch-entrypoint)

  Deploy this stack once, then push both images via CI/CD
  (.github/workflows/build-image.yml) or manually using the PushCommands output.

# ── Parameters ────────────────────────────────────────────────────────────────
Parameters:

  ProjectName:
    Type: String
    Description: >
      Project namespace — single source of truth for resource names and the
      Project tag (ADR 0002). Required (no default): the deploy scripts pass it
      from deploy/lib/common.sh so the value is set once for the whole repo.

  Owner:
    Type: String
    Default: springbok
    Description: >
      Owning team or contact, applied as the Owner tag (ADR 0004). Set this to
      the real owning team/distribution list.

# ── Resources ───────────────────────────────────────────────────────────────
Resources:

  PipelineImageRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain   # keep images if the stack is deleted
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${ProjectName}-etl-pipeline'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the last 5 images; expire older ones",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  FetcherImageRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain   # keep images if the stack is deleted
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${ProjectName}-etl-fetcher'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the last 5 images; expire older ones",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

# ── Outputs ─────────────────────────────────────────────────────────────────
Outputs:

  PipelineRepositoryUri:
    Description: >
      Full ECR URI for the pipeline image.
      Passed as EcrImageUri to batch.yaml by deploy.sh.
    Value: !GetAtt PipelineImageRepo.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-PipelineRepositoryUri"

  PipelineRepositoryName:
    Description: ECR repository name for the pipeline image.
    Value: !Ref PipelineImageRepo
    Export:
      Name: !Sub "${AWS::StackName}-PipelineRepositoryName"

  FetcherRepositoryUri:
    Description: >
      Full ECR URI for the fetcher image.
      Imported by fetch.yaml via Fn::ImportValue.
    Value: !GetAtt FetcherImageRepo.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-FetcherRepositoryUri"

  FetcherRepositoryName:
    Description: ECR repository name for the fetcher image.
    Value: !Ref FetcherImageRepo
    Export:
      Name: !Sub "${AWS::StackName}-FetcherRepositoryName"

  PushCommands:
    Description: >
      Manual push commands for both images.  CI/CD via build-image.yml handles
      this automatically on push to main/master.
    Value: !Sub |
      # Login
      aws ecr get-login-password --region ${AWS::Region} \
        | docker login --username AWS --password-stdin \
          ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com

      # Pipeline image (AWS Batch ETL job — includes JRE)
      docker build --platform linux/amd64 --target pipeline \
        -t ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-etl-pipeline:latest \
        .
      docker push \
        ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-etl-pipeline:latest

      # Fetcher image (ECS Fargate fetch task — no Java)
      docker build --platform linux/amd64 --target fetcher \
        -t ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-etl-fetcher:latest \
        .
      docker push \
        ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-etl-fetcher:latest
