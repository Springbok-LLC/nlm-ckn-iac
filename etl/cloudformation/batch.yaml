AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NLM-CKN AWS Batch compute environment for the release pipeline.
  Runs release.py end-to-end (tarball extract + fetch + full ETL) on EC2
  with Docker socket access so ArangoDB can be started as a sibling container.

# ── Notes ──────────────────────────────────────────────────────────────────────
#
# EC2 launch type is required — Fargate cannot mount /var/run/docker.sock, which
# release.py needs to start the ArangoDB sibling container via the Docker SDK.
#
# Logs currently ship straight to CloudWatch: the job uses the Docker awslogs
# driver for direct, line-by-line delivery to ReleaseLogGroup (see the job
# definition's LogConfiguration). A host log-router daemon (AWS for Fluent Bit)
# — whose multiline filter would reassemble Java/Python stack traces into single
# CloudWatch events — is provisioned by the launch-template UserData for later
# validation and cutover, but it stays INACTIVE until the job switches its log
# driver to fluentd. This stack intentionally runs Fluent Bit as a per-instance
# host daemon rather than configuring FireLens in the job definition.
#
# NCBI credentials are shared with the fetch stack: NCBI_EMAIL is read from the
# SSM parameter /<project>/ncbi-email and NCBI_API_KEY from Secrets Manager at
# NcbiApiKeySecretArn (both created by etl/cloudformation/fetch.yaml).
#
# Prerequisites:
#   - etl/cloudformation/fetch.yaml deployed (provides NCBI SSM + Secrets Manager)
#   - etl/cloudformation/ecr.yaml deployed (provides pipeline image repository)
#   - Pipeline image pushed to ECR
#   - Private subnets with NAT gateway (job needs GitHub, NCBI, CELLxGENE, S3)
#   - shared/cloudformation/shared-resources.yaml deployed (provides the
#     ArangoDB dataset bucket, mirrored to SSM at S3Bucket below)
#
# Deploy:
#   aws cloudformation deploy \
#     --template-file etl/cloudformation/batch.yaml \
#     --stack-name nlm-ckn-etl-batch \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides \
#         ProjectName=nlm-ckn \
#         EcrImageUri=<account>.dkr.ecr.<region>.amazonaws.com/nlm-ckn-etl-pipeline:latest \
#         NcbiApiKeySecretArn=<arn> \
#         VpcId=vpc-<id> \
#         SubnetIds=subnet-<a>,subnet-<b>
#
#   S3Bucket resolves from SSM at deploy time — do not pass a literal bucket
#   name via --parameter-overrides. Override the Default below (its value is
#   an SSM parameter *name*, not a bucket name) if ProjectName changes.

Parameters:

  ProjectName:
    Type: String
    Description: >
      Project namespace — single source of truth for resource names, IAM
      resource ARNs, and the Project tag (ADR 0002). Required (no default): the
      deploy scripts pass it from deploy/lib/common.sh so the value is set once
      for the whole repo (shared with the fetch/ecr/github-oidc stacks, which
      reference these names cross-stack).

  Owner:
    Type: String
    Default: springbok
    Description: >
      Owning team or contact, applied as the Owner tag (ADR 0004). Set this to
      the real owning team/distribution list.

  S3Bucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /nlm-ckn/shared/arangodb-bucket-name
    Description: >
      S3 bucket for external cache, baseline dumps, and run artifacts. This
      parameter's value is an SSM parameter name (kept up to date by
      deploy/01-deploy-account-setup.sh whenever
      shared/cloudformation/shared-resources.yaml is deployed); CloudFormation
      resolves it to the live bucket name at deploy time. If ProjectName
      changes, override this Default to /<project>/shared/arangodb-bucket-name.


  EcrImageUri:
    Type: String
    Description: >
      Full ECR URI for the pipeline image (includes JRE), e.g.
      123456789012.dkr.ecr.us-east-1.amazonaws.com/nlm-ckn-etl-pipeline:latest

  NcbiApiKeySecretArn:
    Type: String
    Description: >
      Secrets Manager ARN for the NCBI API key. Created by fetch.yaml and
      visible in the nlm-ckn-etl-fetch stack outputs (NcbiApiKeySecretArn).

  NcbiEmailParameterName:
    Type: String
    Default: /nlm-ckn/ncbi-email
    Description: >
      SSM parameter name for the NCBI email (created by fetch.yaml). If
      ProjectName changes, update this to /<project>/ncbi-email.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC containing the subnets below.

  SubnetIds:
    Type: CommaDelimitedList
    Description: >
      Comma-separated private subnet IDs (must have a NAT gateway for outbound
      access to GitHub Releases, NCBI APIs, CELLxGENE, ECR, S3, Secrets Manager).

  InstanceTypes:
    Type: CommaDelimitedList
    Default: 'r5.4xlarge,r5.2xlarge'
    Description: >
      EC2 instance types for the compute environment. The release pipeline
      needs ~64 GB RAM minimum (32 GB Java heap + ArangoDB + Python overhead).
      r5.4xlarge (128 GB) gives comfortable headroom; r5.2xlarge (64 GB) is
      the minimum viable size.

  MaxvCpus:
    Type: Number
    Default: 16
    Description: >
      Maximum vCPUs across the compute environment. One release job uses up to
      8 vCPUs (one r5.2xlarge = 8 vCPUs); set higher to allow concurrent runs.

  EbsVolumeGiB:
    Type: Number
    Default: 200
    Description: >
      EBS root volume size (GiB) for compute instances. Needs to hold the
      ArangoDB data directory, baseline/golden dumps, OBO files, and tuple output.

  FluentBitImage:
    Type: String
    Default: public.ecr.aws/aws-observability/aws-for-fluent-bit:2.34.3.20260722
    Description: >
      Container image for the host log-router daemon (AWS for Fluent Bit). Run on
      each compute instance via the launch template to reassemble multi-line
      Java/Python stack traces into single CloudWatch events before shipping them
      to the release log group. Pinned to an immutable build tag (not the mutable
      'stable' tag) so instance bootstrap is reproducible; override at deploy time
      to select a newer digest/version. Bump this when moving to a newer AWS for
      Fluent Bit release.

  GithubTokenSecretArn:
    Type: String
    Default: ''
    Description: >
      Optional. Secrets Manager ARN for a GitHub token used to post deployment
      status updates. When provided, GITHUB_TOKEN is injected into the job
      container via Secrets Manager rather than as a plain environment variable.
      Create with deploy-batch.sh by setting GITHUB_TOKEN in the environment.

Conditions:

  HasGithubToken: !Not [!Equals [!Ref GithubTokenSecretArn, '']]

Resources:

  # ── Logging ───────────────────────────────────────────────────────────────────
  # The job logs to CloudWatch directly via the Docker awslogs driver (see the
  # job definition's LogConfiguration), writing to this group. The host
  # AWS-for-Fluent-Bit daemon (see InstanceLaunchTemplate) that would reassemble
  # multi-line Java/Python stack traces is provisioned for a later cutover and
  # remains INACTIVE until the job switches its log driver to fluentd.

  ReleaseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/batch/${ProjectName}-release'
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  # ── Networking ────────────────────────────────────────────────────────────────

  ReleaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only security group for NLM-CKN Batch - no inbound rules needed
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
          Description: Allow HTTPS outbound (GitHub, NCBI, CELLxGENE, ECR, S3, Secrets Manager)
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: '0.0.0.0/0'
          Description: Allow DNS outbound (UDP)
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: '0.0.0.0/0'
          Description: Allow DNS outbound (TCP fallback)
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-release'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  # ── IAM: Batch service role ───────────────────────────────────────────────────
  # Used by AWS Batch itself to manage EC2 instances and ECS resources.

  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-release-batch-service-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  # ── IAM: EC2 instance role ────────────────────────────────────────────────────
  # Assumed by the EC2 instances in the compute environment so the ECS container
  # agent can pull images from ECR and report status to ECS.

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-release-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
      Policies:
        # The host Fluent Bit daemon runs under the instance profile and writes
        # the reassembled log events to the release log group via the
        # cloudwatch_logs output (auto_create_group is off — the group is
        # created by ReleaseLogGroup below, so only stream/put rights are needed).
        - PolicyName: FluentBitCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteReleaseLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt ReleaseLogGroup.Arn
                  - !Sub '${ReleaseLogGroup.Arn}:*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # ── IAM: Job execution role ───────────────────────────────────────────────────
  # Used by ECS to pull the pipeline image from ECR and inject secrets.

  JobExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-release-job-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadNcbiCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSsmParameters
                Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*'
              - Sid: ReadApiKeySecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref NcbiApiKeySecretArn
              - !If
                - HasGithubToken
                - Sid: ReadGithubTokenSecret
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref GithubTokenSecretArn
                - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  # ── IAM: Job role ─────────────────────────────────────────────────────────────
  # Runtime permissions for application code inside the release container.

  JobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-release-job-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3ReleaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${S3Bucket}'
              - Sid: ReadWriteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${S3Bucket}/*'
        - PolicyName: ReadNcbiCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSsmParameters
                Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*'
              - Sid: ReadApiKeySecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref NcbiApiKeySecretArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  # ── Launch template: expand EBS root volume + log-router daemon ───────────────
  # The default Amazon ECS-optimized AMI ships with a 30 GiB root volume, which
  # is too small for ArangoDB dumps, OBO files, and tuple output combined.
  #
  # UserData (MIME multipart so the AMI's own ECS bootstrap still runs) does two
  # things on each compute instance:
  #   1. Enables the Docker `fluentd` logging driver in the ECS agent config, so
  #      the release job can route its stdout/stderr to the host daemon instead
  #      of straight to CloudWatch.
  #   2. Starts AWS for Fluent Bit as a restart=always host daemon listening on
  #      the Docker forward protocol (127.0.0.1:24224). Its multiline filter
  #      reassembles Java/Python stack traces into single events, then the
  #      cloudwatch_logs output ships them to ReleaseLogGroup. The daemon writes
  #      under the instance profile (see InstanceRole's FluentBitCloudWatchLogs).

  InstanceLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ProjectName}-release-lt'
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref EbsVolumeGiB
              VolumeType: gp3
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            !Sub |
              MIME-Version: 1.0
              Content-Type: multipart/mixed; boundary="==BATCH-BOUNDARY=="

              --==BATCH-BOUNDARY==
              Content-Type: text/x-shellscript; charset="us-ascii"

              #!/bin/bash
              set -euo pipefail

              # 1. Allow the fluentd Docker logging driver for Batch/ECS tasks on
              #    this host (read by the ECS agent at start-up). If the AMI
              #    already sets ECS_AVAILABLE_LOGGING_DRIVERS, append fluentd to
              #    the existing array (preserving json-file/awslogs) rather than
              #    leaving it out; otherwise create the setting.
              if grep -q '^ECS_AVAILABLE_LOGGING_DRIVERS=' /etc/ecs/ecs.config 2>/dev/null; then
                grep -q '^ECS_AVAILABLE_LOGGING_DRIVERS=.*"fluentd"' /etc/ecs/ecs.config || \
                  sed -i 's/^\(ECS_AVAILABLE_LOGGING_DRIVERS=\[.*\)\]/\1,"fluentd"]/' /etc/ecs/ecs.config
              else
                echo 'ECS_AVAILABLE_LOGGING_DRIVERS=["json-file","awslogs","fluentd"]' >> /etc/ecs/ecs.config
              fi

              # The ECS agent reads ECS_AVAILABLE_LOGGING_DRIVERS only at start-up
              # and caches it, so restart it now to register fluentd before any
              # task cutover (a no-op driver list change is picked up next boot
              # otherwise). Safe here: the agent starts (or restarts) cleanly.
              systemctl restart ecs

              # 2. Fluent Bit config: forward input receives the job's logs from the
              #    Docker fluentd driver; the multiline filter concatenates
              #    java/python stack traces (both parsers are built into the image);
              #    cloudwatch_logs ships the reassembled events to the release group.
              mkdir -p /etc/fluent-bit
              cat > /etc/fluent-bit/fluent-bit.conf <<'FBCONF'
              [SERVICE]
                  Flush        5
                  Grace        30
                  Log_Level    info

              [INPUT]
                  Name             forward
                  Listen           127.0.0.1
                  Port             24224

              [FILTER]
                  Name                  multiline
                  Match                 *
                  multiline.key_content log
                  multiline.parser      java,python

              [OUTPUT]
                  Name              cloudwatch_logs
                  Match             *
                  region            ${AWS::Region}
                  log_group_name    ${ReleaseLogGroup}
                  log_stream_prefix release/
                  auto_create_group false
              FBCONF

              # 3. Run the log router as a host daemon (survives crashes/reboots).
              #    Mount only the main config over the image default so the built-in
              #    parsers stay intact; host networking binds 127.0.0.1:24224.
              systemctl enable --now docker
              docker rm -f fluent-bit >/dev/null 2>&1 || true
              docker run -d --name fluent-bit --restart always --network host \
                -v /etc/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro \
                ${FluentBitImage}
              --==BATCH-BOUNDARY==--

  # ── Batch: Compute Environment ────────────────────────────────────────────────

  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: !Sub '${ProjectName}-release'
      Type: MANAGED
      State: ENABLED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: !Ref MaxvCpus
        DesiredvCpus: 0
        InstanceTypes: !Ref InstanceTypes
        InstanceRole: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref ReleaseSecurityGroup
        Subnets: !Ref SubnetIds
        LaunchTemplate:
          LaunchTemplateId: !Ref InstanceLaunchTemplate
        Tags:
          Project: !Ref ProjectName
          Component: etl
          Owner: !Ref Owner
          ManagedBy: CloudFormation
          Repository: nlm-ckn-iac
      Tags:
        Project: !Ref ProjectName
        Component: etl
        Owner: !Ref Owner
        ManagedBy: CloudFormation
        Repository: nlm-ckn-iac

  # ── Batch: Job Queue ──────────────────────────────────────────────────────────

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub '${ProjectName}-release'
      State: ENABLED
      Priority: 10
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment
      Tags:
        Project: !Ref ProjectName
        Component: etl
        Owner: !Ref Owner
        ManagedBy: CloudFormation
        Repository: nlm-ckn-iac

  # ── Batch: Job Definition ─────────────────────────────────────────────────────
  #
  # NLM_CKN_TAG (required) and optional TAR_SOURCE / RUN_NAME are
  # passed as container environment overrides at submit time by trigger-release.sh.
  #
  # The Docker socket is mounted so release.py can start ArangoDB as a sibling
  # container on the same EC2 instance via the Docker SDK.

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub '${ProjectName}-release'
      Type: container
      # Propagate the job-definition tags onto the ECS task Batch launches.
      PropagateTags: true
      PlatformCapabilities:
        - EC2
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 86400  # 24 h ceiling — full release takes ~8–12 h
      ContainerProperties:
        Image: !Ref EcrImageUri
        JobRoleArn: !GetAtt JobRole.Arn
        ExecutionRoleArn: !GetAtt JobExecutionRole.Arn
        ResourceRequirements:
          - Type: VCPU
            Value: '8'
          - Type: MEMORY
            Value: '61440'  # 60 GiB — leaves headroom on r5.2xlarge (64 GiB total)
        Environment:
          - Name: S3_BUCKET
            Value: !Ref S3Bucket
        Secrets:
          - Name: NCBI_EMAIL
            ValueFrom: !Sub >-
              arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NcbiEmailParameterName}
          - Name: NCBI_API_KEY
            ValueFrom: !Ref NcbiApiKeySecretArn
          - !If
            - HasGithubToken
            - Name: GITHUB_TOKEN
              ValueFrom: !Ref GithubTokenSecretArn
            - !Ref AWS::NoValue
        Volumes:
          - Name: docker-socket
            Host:
              SourcePath: /var/run/docker.sock
        MountPoints:
          - ContainerPath: /var/run/docker.sock
            SourceVolume: docker-socket
            ReadOnly: false
        # Log driver: awslogs (direct to CloudWatch) while the host Fluent Bit
        # daemon is validated. The daemon, its IAM, and the launch-template
        # UserData remain provisioned but UNUSED until the job routes to it.
        #
        # To re-enable stack-trace reassembly once the daemon is confirmed
        # delivering (a fresh stream appears under /batch/<project>-release from
        # a test forward), swap this block back to:
        #     LogDriver: fluentd
        #     Options:
        #       fluentd-address: 127.0.0.1:24224
        #       fluentd-async: 'true'     # NOTE: silently drops logs if the
        #                                 # daemon is down — do not re-enable
        #                                 # until the daemon is verified.
        #       tag: 'default/{{.ID}}'    # -> stream release/default/<container-id>
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref ReleaseLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: release
      Tags:
        Project: !Ref ProjectName
        Component: etl
        Owner: !Ref Owner
        ManagedBy: CloudFormation
        Repository: nlm-ckn-iac

Outputs:

  JobQueueName:
    Value: !Ref JobQueue
    Description: Batch job queue name (<project>-release).

  JobDefinitionArn:
    Value: !Ref JobDefinition
    Description: Batch job definition ARN.

  LogGroupName:
    Value: !Ref ReleaseLogGroup
    Description: CloudWatch log group for release job output (/batch/<project>-release).

  ComputeEnvironmentArn:
    Value: !Ref ComputeEnvironment
    Description: Batch compute environment ARN.
