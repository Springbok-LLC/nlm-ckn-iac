AWSTemplateFormatVersion: "2010-09-09"
Description: >
  NLM-CKN GitHub OIDC — IAM role that allows GitHub Actions to push Docker
  images to ECR without long-lived credentials.

  The role is assumed via GitHub's OIDC provider. Multiple repositories can
  be granted access via the GitHubRepos parameter.

  Deploy this stack once per account. If a GitHub OIDC provider already
  exists in the account, set CreateOidcProvider=false to skip creating it.

# ── Deployment ────────────────────────────────────────────────────────────────
#
# Deploy once per AWS account.  The stack creates IAM roles with explicit
# RoleNames, so CAPABILITY_NAMED_IAM is required.
#
#   aws cloudformation deploy \
#     --stack-name nlm-ckn-etl-github-oidc \
#     --template-file etl/cloudformation/github-oidc.yaml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides \
#       GitHubRepos="repo:Springbok-LLC/nlm-ckn-etl:*"
#
#   S3BucketName resolves from SSM at deploy time — do not pass a literal
#   bucket name via --parameter-overrides.
#
# If a GitHub Actions OIDC provider already exists in the account (only one is
# allowed per account), add CreateOidcProvider=false to --parameter-overrides.
#
# After the stack is created/updated, copy the role ARNs from the stack outputs
# into the corresponding GitHub Actions repository secrets:
#
#   BuildRoleArn        → AWS_BUILD_ROLE_ARN          (build-image.yml — release)
#   FetcherPushRoleArn  → AWS_FETCHER_PUSH_ROLE_ARN   (ci.yml — fetcher push)
#   ReleaseRoleArn      → AWS_RELEASE_ROLE_ARN         (on-release.yml — Batch job)
#
# Read the outputs with:
#   aws cloudformation describe-stacks \
#     --stack-name nlm-ckn-etl-github-oidc \
#     --query "Stacks[0].Outputs" --output table
#
# Setting AWS_FETCHER_PUSH_ROLE_ARN is mandatory: without it the ci.yml
# build-fetcher job cannot assume its role and the push step fails.

# ── Parameters ──────────────────────────────────────────────────────────────
Parameters:

  ProjectName:
    Type: String
    Default: nlm-ckn
    Description: >
      Project namespace — single source of truth for the AWS resource names and
      ARNs this stack grants access to (ECR repos, Batch queue/definition, and
      the release IAM roles) and for the Project tag (ADR 0002). Must match the
      ProjectName used by the ecr / batch stacks. NOTE: this is distinct from
      the GitHub org/repo identity (GitHubRepos), which is a separate concern.

  Owner:
    Type: String
    Default: springbok
    Description: >
      Owning team or contact, applied as the Owner tag (ADR 0004). Set this to
      the real owning team/distribution list.

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to false if a GitHub Actions OIDC provider already exists in this
      account (there can only be one per account).

  GitHubRepos:
    Type: CommaDelimitedList
    Default: "repo:Springbok-LLC/nlm-ckn-etl:*"
    Description: >
      Repositories allowed to assume this role, in "repo:OWNER/REPO:*" format.
      Comma-separate multiple values.

  EcrStackName:
    Type: String
    Default: nlm-ckn-etl-ecr
    Description: >
      Name of the ECR CloudFormation stack. The role is granted push access
      to all repositories in that stack.

  S3BucketName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /nlm-ckn/shared/arangodb-bucket-name
    Description: >
      S3 bucket used to stage release tarballs and release.json (the S3_BUCKET
      secret). The release role is granted s3:PutObject and s3:GetObject on
      the runs/ prefix of this bucket. This parameter's value is an SSM
      parameter name (kept up to date by
      deploy/01-deploy-account-setup.sh whenever
      shared/cloudformation/shared-resources.yaml is deployed); CloudFormation
      resolves it to the live bucket name at deploy time. If ProjectName
      changes, override this Default to /<project>/shared/arangodb-bucket-name.


# ── Conditions ──────────────────────────────────────────────────────────────
Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

# ── Resources ────────────────────────────────────────────────────────────────
Resources:

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # GitHub's OIDC thumbprint (stable; rotated by GitHub with notice)
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-etl-github-build'
      Description: Assumed by GitHub Actions to build and push ECR images
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # job_workflow_ref is the file defining the job that assumes the
                # role.  build-image.yml builds both images during a release, so
                # it needs push access to both repositories.  ci.yml pushes only
                # the fetcher image and uses the narrower FetcherPushRole below.
                #
                # Releases publish from a tag, so the reusable workflow runs at
                # refs/tags/<tag>, not refs/heads/main — allow both refs.
                token.actions.githubusercontent.com:job_workflow_ref:
                  - Springbok-LLC/nlm-ckn-etl/.github/workflows/build-image.yml@refs/heads/main
                  - Springbok-LLC/nlm-ckn-etl/.github/workflows/build-image.yml@refs/tags/*
                token.actions.githubusercontent.com:sub: !Ref GitHubRepos
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  BuildPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-etl-github-build'
      Roles:
        - !Ref BuildRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ECR login (account-wide; no resource restriction possible)
          - Sid: EcrLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"

          # ECR push to pipeline and fetcher repositories
          - Sid: EcrPush
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
            Resource:
              - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-etl-pipeline"
              - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-etl-fetcher"

          # CloudFormation read — resolves ECR repository URIs at build time
          - Sid: CloudFormationDescribe
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${EcrStackName}/*"

  # Narrow role for ci.yml, which pushes ONLY the fetcher image on every main
  # build.  Kept separate from BuildRole so a compromise of the CI workflow
  # cannot push to the pipeline repository.
  FetcherPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-etl-github-fetcher-push'
      Description: Assumed by ci.yml to push only the fetcher image to ECR
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:job_workflow_ref: Springbok-LLC/nlm-ckn-etl/.github/workflows/ci.yml@refs/heads/main
              StringLike:
                token.actions.githubusercontent.com:sub: !Ref GitHubRepos
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  FetcherPushPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-etl-github-fetcher-push'
      Roles:
        - !Ref FetcherPushRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ECR login (account-wide; no resource restriction possible)
          - Sid: EcrLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"

          # ECR push restricted to the fetcher repository only
          - Sid: EcrPushFetcher
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
            Resource:
              - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-etl-fetcher"

          # CloudFormation read — resolves the fetcher ECR repository URI at build time
          - Sid: CloudFormationDescribe
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${EcrStackName}/*"

  ReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-etl-github-release'
      Description: Assumed by GitHub Actions to submit Batch release jobs and stage artifacts to S3
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Releases publish from a tag, so on-release.yml runs at
                # refs/tags/<tag>, not refs/heads/main — allow both refs.
                token.actions.githubusercontent.com:job_workflow_ref:
                  - Springbok-LLC/nlm-ckn-etl/.github/workflows/on-release.yml@refs/heads/main
                  - Springbok-LLC/nlm-ckn-etl/.github/workflows/on-release.yml@refs/tags/*
                token.actions.githubusercontent.com:sub: !Ref GitHubRepos
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: etl
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: nlm-ckn-iac

  ReleasePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-etl-github-release'
      Roles:
        - !Ref ReleaseRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Submit release job to the release queue
          - Sid: BatchSubmitJob
            Effect: Allow
            Action: batch:SubmitJob
            Resource:
              - !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-queue/${ProjectName}-release"
              - !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/${ProjectName}-release*"

          # Register a new job-definition revision to pin the pipeline image
          # (containerOverrides does not accept "image"; a new revision is required)
          - Sid: BatchRegisterJobDefinition
            Effect: Allow
            Action: batch:RegisterJobDefinition
            Resource: !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/${ProjectName}-release*"

          # Read the current job definition to copy its containerProperties
          - Sid: BatchDescribeJobDefinitions
            Effect: Allow
            Action: batch:DescribeJobDefinitions
            Resource: "*"

          # RegisterJobDefinition re-passes the job/execution roles embedded in
          # containerProperties, which requires iam:PassRole on those roles
          - Sid: PassBatchJobRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-release-job-role"
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-release-job-execution-role"
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

          # Stage release tarball and release.json to S3
          - Sid: S3StageArtifacts
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub "arn:aws:s3:::${S3BucketName}/runs/*"

# ── Outputs ──────────────────────────────────────────────────────────────────
Outputs:

  BuildRoleArn:
    Description: ARN of the GitHub Actions build role (use in AWS_BUILD_ROLE_ARN)
    Value: !GetAtt BuildRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BuildRoleArn"

  FetcherPushRoleArn:
    Description: ARN of the ci.yml fetcher-push role (use in AWS_FETCHER_PUSH_ROLE_ARN)
    Value: !GetAtt FetcherPushRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FetcherPushRoleArn"

  ReleaseRoleArn:
    Description: ARN of the GitHub Actions release role (use in AWS_RELEASE_ROLE_ARN)
    Value: !GetAtt ReleaseRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReleaseRoleArn"
